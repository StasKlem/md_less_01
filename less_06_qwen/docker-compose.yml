version: '3.8'

services:
  kbju-bot:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    container_name: kbju-bot
    restart: unless-stopped
    environment:
      # Telegram
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_TIMEOUT=30s
      
      # LLM
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_TIMEOUT=60s
      
      # Database
      - DATABASE_PATH=/app/data/kbju.db
      
      # Access Control
      - ACCESS_CONTROL_MODE=${ACCESS_CONTROL_MODE:-public}
      - ACCESS_CONTROL_ALLOWED_USER_IDS=${ACCESS_CONTROL_ALLOWED_USER_IDS:-}
      
      # Report
      - REPORT_SEND_TIME=${REPORT_SEND_TIME:-21:00}
      - REPORT_TIMEZONE=${REPORT_TIMEZONE:-Europe/Moscow}
      
      # Logging
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_FORMAT=${LOG_FORMAT:-text}
      
      # Timezone
      - TZ=${TZ:-Europe/Moscow}
    volumes:
      # Сохраняем базу данных между перезапусками
      - kbju-data:/app/data
      # Опционально: логи
      - ./logs:/app/logs
    networks:
      - kbju-network
    healthcheck:
      test: ["CMD", "pgrep", "-f", "kbju-bot"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  kbju-data:
    driver: local
    name: kbju-bot-data

networks:
  kbju-network:
    driver: bridge
    name: kbju-network
