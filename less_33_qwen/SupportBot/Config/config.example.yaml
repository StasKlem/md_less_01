# Config/config.example.yaml - Пример конфигурации SupportBot

app:
  name: SupportBot
  version: 1.0.0

llm:
  provider: openai  # openai | ollama | mlx | local
  api_key: your-api-key-here  # замените на ваш API ключ или используйте ${OPENAI_API_KEY}
  model: gpt-4o-mini
  base_url: https://api.openai.com/v1
  timeout: 30

embeddings:
  provider: local  # openai | local | ollama | lmstudio
  model: text-embedding-bge-m3
  dimension: 1024
  base_url: http://127.0.0.1:1234/v1  # URL локального API (Ollama, LM Studio, etc.)

rag:
  chunk_size: 500
  chunk_overlap: 50
  top_k: 5
  min_score: 0.7

context:
  max_history_messages: 10
  ttl_seconds: 3600

storage:
  database_path: ~/Library/Application Support/SupportBot/bot.db
  knowledge_base_path: ./KnowledgeBase

logging:
  level: info
  file: ~/Library/Logs/SupportBot/app.log
