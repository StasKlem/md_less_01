# Config/config.example.yaml - Пример конфигурации SupportBot

app:
  name: SupportBot
  version: 1.0.0

llm:
  provider: routerai  # routerai | openai | local
  api_key: your-routerai-api-key  # замените на ваш API ключ RouterAI или используйте ${ROUTERAI_API_KEY}
  model: deepseek/deepseek-v3.2
  base_url: https://routerai.ru/api/v1
  timeout: 60

embeddings:
  provider: local  # openai | local | ollama | lmstudio
  model: text-embedding-bge-m3
  dimension: 1024
  base_url: http://127.0.0.1:1234/v1  # URL локального API (Ollama, LM Studio, etc.)

rag:
  chunk_size: 500
  chunk_overlap: 50
  top_k: 5
  min_score: 0.7

context:
  max_history_messages: 10
  ttl_seconds: 3600

storage:
  database_path: ~/Library/Application Support/SupportBot/bot.db
  knowledge_base_path: ./KnowledgeBase

logging:
  level: info
  file: ~/Library/Logs/SupportBot/app.log
